<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#140d08">
  <meta name="color-scheme" content="dark">
  <title>Page not found — Privo</title>
  <link rel="icon" type="image/x-icon" href="p/media/privo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/8f1701cd51.js" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="/p/css/style.css">
  <link rel="stylesheet" href="/p/css/404.css">
  <script src="/p/js/site-shell.js" defer></script>
</head>

<body>
  <div class="page">
  <div data-site-header></div>
  <main class="card">
    <span class="mark"><i class="fa-solid fa-link-slash" aria-hidden="true"></i></span>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p class="lede">
      The page or short link you’re looking for doesn’t exist — it may have been removed,
      or the address might be mistyped.
    </p>

    <div class="actions">
      <a class="btn btn--primary" href="/">
        <i class="fa-solid fa-house" aria-hidden="true"></i> Back to Privo
      </a>
      <a class="btn btn--ghost" href="/cloud">
        Privo Cloud <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </a>
    </div>

    <p class="foot">Powered by Cloudflare</p>
  </main>
  </div>
</body>
</html>
